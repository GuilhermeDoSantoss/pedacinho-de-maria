name: Keep Render Backend Awake

on:
  schedule:
    # Executa aproximadamente a cada 5 minutos
    - cron: "*/5 * * * *"

  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Render Backend
        run: |
          curl \
            --silent \
            --show-error \
            --fail \
            --retry 5 \
            --retry-delay 15 \
            --retry-all-errors \
            --max-time 120 \
            https://pedacinho-de-maria.onrender.com/actuator/health
