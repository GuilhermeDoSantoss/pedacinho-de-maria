# Sem container de MongoDB local — o projeto usa MongoDB Atlas em todos os
# ambientes (decisão registrada: instalação local do Mongo não era viável).
# Este compose sobe só o backend; MONGODB_URI (string de conexão do Atlas)
# precisa estar definida no seu .env ou exportada no shell antes de rodar.
services:
  backend:
    build: .
    container_name: pedacinho-backend-dev
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      MONGODB_URI: ${MONGODB_URI}
      CORS_ALLOWED_ORIGINS: http://localhost:5500,http://127.0.0.1:5500,http://localhost:5501,http://127.0.0.1:5501
      # Opcionais — não têm default hardcoded no application.yml (correto,
      # não são segredo de mentira). Sem definir no seu .env/shell, a
      # aplicação sobe normalmente; só o disparo de WhatsApp fica inoperante.
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}